
[nosetests]
verbosity=2
with-coverage=1
cover-package=service
cover-erase=1

[coverage:run]
branch = True
source = service

[coverage:report]
show_missing = True
fail_under = 0

[flake8]
exclude = .git,__pycache__,venv,.venv
max-line-length = 88
statistics = True

[pylint]
disable = C0114,C0115,C0116

